<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Readium Alchemy Index</title>
<style>
*{box-sizing:border-box;transition:none !important;animation:none !important}
body{margin:0;background:#fff;color:#000;font:16px/1.4 Arial,Verdana,sans-serif}
header,main{max-width:1100px;margin:0 auto;padding:14px}
header{border-bottom:2px solid #000}
h1{margin:0;font-size:26px}
p{margin:4px 0;color:#222}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{border:1px solid #000;padding:8px}
.stat b{display:block;font-size:20px}
.stat span{font-size:13px;color:#222}
#status{font-size:13px;margin-top:8px;color:#222;word-wrap:break-word;word-break:break-word}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
input,button{font:inherit;color:#000;background:#fff;border:2px solid #000;border-radius:6px;padding:10px;min-height:48px}
input[type=search]{width:100%}
button{cursor:pointer}
.tab.active{background:#000;color:#fff}
.tools{margin:12px 0}
.tier{border:1px solid #000;margin:10px 0}
summary{padding:12px 14px;cursor:pointer;font-weight:bold;min-height:48px}
.recipe{display:grid;grid-template-columns:1fr 1.3fr;gap:9px;padding:9px 14px;border-top:1px solid #888;align-items:center}
.element{font-weight:bold}
.ingredients{color:#222;word-wrap:break-word;word-break:break-word}
.inventory-layout{display:grid;grid-template-columns:minmax(240px,.85fr) minmax(0,1.5fr);gap:14px;align-items:start}
.panel{border:1px solid #000;padding:14px;min-width:0}
.panel h2{font-size:18px;margin:0 0 5px}
.panel p{font-size:14px}
.inventory-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:12px}
.pick{display:grid;grid-template-columns:32px 1fr;align-items:center;border:1px solid #888;padding:6px 8px;min-height:48px;min-width:0}
.pick input{width:24px;height:24px;min-height:0;padding:0;margin:0}
.pick span{word-wrap:break-word;word-break:break-word}
.inventory-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.count{font-size:14px;font-weight:bold}
.more{margin-top:10px}
.more button{width:100%}
.branch-list{display:grid;gap:11px;margin-top:12px}
.branch{border:1px solid #000;padding:12px}
.branch-flow{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr) 24px minmax(0,1.1fr);gap:7px;align-items:center}
.node{border:1px solid #444;padding:9px;text-align:center;min-width:0;word-wrap:break-word;word-break:break-word}
.node.output{border:2px solid #000;font-weight:bold}
.plus,.arrow{text-align:center;font-weight:bold}
.branch-foot{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px;font-size:13px}
.empty{border:1px dashed #000;padding:20px;text-align:center}
@media(max-width:720px){.inventory-layout{grid-template-columns:1fr}.branch-flow{grid-template-columns:1fr}.branch-foot{grid-template-columns:1fr}.recipe{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1>Readium Alchemy Index</h1><p>Community recipe explorer. Choose your discoveries and branch into everything you can craft next.</p>
<div class="stats" id="stats"></div><div id="status">Loading data...</div></header>
<main><div class="tabs" id="tabs"><button class="tab active" data-view="inventory">My discoveries</button><button class="tab" data-view="route">Completion route</button><button class="tab" data-view="recipes">All recipes</button></div>
<div class="tools"><input id="search" placeholder="Search elements or recipes..." type="search"></div><div id="content"></div></main>
<script>
(function () {
"use strict";
var STORE_KEY = "readium-alchemy-owned-v1";
var PAGE = 60, TIER_PAGE = 80, ROW_PAGE = 100, POLL_MS = 300000;
var DATA = null, view = "inventory", owned = Object.create(null);
var limits = { picks: PAGE, crafts: PAGE, recipes: ROW_PAGE };
var tierLimit = {}, curTiers = {}, searchTimer = null;
var lowerReady = false;

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === '"' ? "&quot;" : "&#39;";
  });
}
function val(x) { return x === undefined || x === null ? "-" : x; }
function query() { return $("search").value.trim().toLowerCase(); }
function ownedCount() { return Object.keys(owned).length; }

function loadOwned() {
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    if (Array.isArray(saved)) {
      owned = Object.create(null);
      for (var i = 0; i < saved.length; i++) if (typeof saved[i] === "string") owned[saved[i]] = 1;
    }
  } catch (e) { owned = Object.create(null); }
}
function saveOwned() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(Object.keys(owned))); } catch (e) {}
}

function getJson(url) {
  return fetch(url).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

/* Lowercase search keys are built once, only when the first search happens. */
function ensureLower() {
  if (lowerReady) return;
  var i, E = DATA.elements, R = DATA.recipes, T = DATA.route;
  DATA.eLower = new Array(E.length);
  for (i = 0; i < E.length; i++) DATA.eLower[i] = E[i].toLowerCase();
  DATA.recLower = new Array(R.length);
  for (i = 0; i < R.length; i++) DATA.recLower[i] = (R[i][0] + " " + R[i][1] + " " + R[i][2]).toLowerCase();
  DATA.rLower = new Array(T.length);
  for (i = 0; i < T.length; i++) DATA.rLower[i] = (T[i][1] + " " + T[i][2] + " " + T[i][3]).toLowerCase();
  lowerReady = true;
}

function moreButton(key, left) {
  return '<div class="more"><button data-act="more" data-k="' + key + '">Show more (' + left + ' left)</button></div>';
}

/* ---------- My discoveries ---------- */
function picksHtml(q) {
  var E = DATA.elements, L = q ? DATA.eLower : null, h = "", shown = 0, total = 0, i;
  for (i = 0; i < E.length; i++) {
    if (q && L[i].indexOf(q) < 0) continue;
    total++;
    if (shown >= limits.picks) continue;
    shown++;
    h += '<label class="pick"><input type="checkbox" data-n="' + esc(E[i]) + '"' + (owned[E[i]] ? " checked" : "") + '><span>' + esc(E[i]) + "</span></label>";
  }
  return { list: h, more: total > shown ? moreButton("picks", total - shown) : "" };
}
function fillPicks() {
  var q = query();
  if (q) ensureLower();
  var p = picksHtml(q);
  $("picks").innerHTML = p.list;
  $("picksMore").innerHTML = p.more;
}
function syncChecks() {
  var boxes = $("picks").getElementsByTagName("input");
  for (var i = 0; i < boxes.length; i++) boxes[i].checked = !!owned[boxes[i].getAttribute("data-n")];
}
function craftList() {
  var R = DATA.recipes, out = [];
  for (var i = 0; i < R.length; i++) {
    var r = R[i];
    if (!owned[r[2]] && owned[r[0]] && owned[r[1]]) out.push(r);
  }
  out.sort(function (x, y) { return x[2] < y[2] ? -1 : x[2] > y[2] ? 1 : 0; });
  return out;
}
function fillCrafts() {
  var crafts = craftList(), n = crafts.length, h = "";
  var shown = Math.min(n, limits.crafts);
  $("count").textContent = ownedCount() + " selected";
  h += "<h2>What can you create next?</h2>";
  h += "<p>" + (n ? n + " new recipe" + (n === 1 ? "" : "s") + " available from your current discoveries." : "No new recipes are available yet. Add more discoveries on the left.") + "</p>";
  h += '<div class="branch-list">';
  for (var i = 0; i < shown; i++) {
    var c = crafts[i];
    h += '<article class="branch"><div class="branch-flow"><div class="node">' + esc(c[0]) + '</div><div class="plus">+</div><div class="node">' + esc(c[1]) +
      '</div><div class="arrow">&rarr;</div><div class="node output">' + esc(c[2]) + '</div></div><div class="branch-foot"><span>Both ingredients are in your inventory</span><button data-act="add" data-n="' + esc(c[2]) + '">I made this &middot; Add</button></div></article>';
  }
  if (!n) h += '<div class="empty">Select the elements you have discovered. Recipes that use two of them will appear here as branching paths.</div>';
  h += "</div>";
  if (n > shown) h += moreButton("crafts", n - shown);
  $("craftsPanel").innerHTML = h;
}
function renderInventory() {
  $("content").innerHTML =
    '<div class="inventory-layout"><section class="panel"><h2>Your discoveries</h2><p>Tick every element you have already made. Your selection is saved in this browser.</p>' +
    '<div class="count" id="count"></div><div class="inventory-list" id="picks"></div><div id="picksMore"></div>' +
    '<div class="inventory-actions"><button data-act="basics">Start with basics</button><button data-act="clear">Clear selection</button></div></section>' +
    '<section class="panel" id="craftsPanel"></section></div>';
  fillPicks();
  fillCrafts();
}

/* ---------- Completion route ---------- */
function routeTiers(q) {
  var T = DATA.route, out = [], cur = null;
  for (var i = 0; i < T.length; i++) {
    if (q && DATA.rLower[i].indexOf(q) < 0) continue;
    if (!cur || cur.t !== T[i][0]) { cur = { t: T[i][0], rows: [] }; out.push(cur); }
    cur.rows.push(i);
  }
  return out;
}
function tierBody(g) {
  var T = DATA.route, lim = tierLimit[g.t] || TIER_PAGE, n = Math.min(g.rows.length, lim), h = "";
  for (var i = 0; i < n; i++) {
    var r = T[g.rows[i]];
    h += '<div class="recipe"><span class="element">' + esc(r[1]) + '</span><span class="ingredients">' + esc(r[2]) + " + " + esc(r[3]) + "</span></div>";
  }
  if (g.rows.length > n) h += '<div class="more"><button data-act="tiermore" data-t="' + g.t + '">Show more (' + (g.rows.length - n) + ' left)</button></div>';
  return h;
}
function renderRoute(q) {
  if (q) ensureLower();
  var groups = routeTiers(q), h = "";
  curTiers = {};
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i], open = q ? i < 3 : g.t <= 2;
    curTiers[g.t] = g;
    h += '<details class="tier" data-t="' + g.t + '"' + (open ? " open" : "") + "><summary>Tier " + g.t + " - " + g.rows.length + ' elements</summary><div class="tier-body" data-f="' + (open ? "1" : "0") + '">' + (open ? tierBody(g) : "") + "</div></details>";
  }
  if (!groups.length) h = '<div class="empty">No matching elements.</div>';
  $("content").innerHTML = h;
}

/* ---------- All recipes ---------- */
function renderRecipes(q) {
  if (q) ensureLower();
  var R = DATA.recipes, L = q ? DATA.recLower : null, h = "", shown = 0, total = 0;
  for (var i = 0; i < R.length; i++) {
    if (q && L[i].indexOf(q) < 0) continue;
    total++;
    if (shown >= limits.recipes) continue;
    shown++;
    h += '<div class="recipe"><span class="ingredients">' + esc(R[i][0]) + " + " + esc(R[i][1]) + '</span><span class="element">' + esc(R[i][2]) + "</span></div>";
  }
  h = total ? '<div class="tier">' + h + "</div>" + (total > shown ? moreButton("recipes", total - shown) : "") : '<div class="empty">No matching recipes.</div>';
  $("content").innerHTML = h;
}

function render() {
  if (!DATA) return;
  var q = query();
  if (view === "inventory") renderInventory();
  else if (view === "route") renderRoute(q);
  else renderRecipes(q);
}

/* ---------- Data loading ---------- */
function showStatus(s) {
  var t = "Commit " + (s.commit ? s.commit.slice(0, 12) : "unknown") + " | Updated " + (s.updatedAt || "not yet");
  if (DATA && DATA.commitMessage) t += " | " + DATA.commitMessage;
  if (s.error) t += " | Sync warning: " + s.error;
  $("status").textContent = t;
}
function showStats(c) {
  c = c || {};
  var labels = [["Elements", c.reachableElements], ["Craftable", c.craftableElements], ["Recipes", c.recipeEntries], ["Tiers", c.tiers]], h = "";
  for (var i = 0; i < labels.length; i++) h += '<div class="stat"><b>' + esc(val(labels[i][1])) + "</b><span>" + labels[i][0] + "</span></div>";
  $("stats").innerHTML = h;
}
function applyBundle(b) {
  DATA = b;
  lowerReady = false;
  showStats(b.counts);
}
function load() {
  $("status").textContent = "Fetching latest data...";
  return Promise.all([getJson("/api/version"), getJson("/api/bundle")]).then(function (a) {
    applyBundle(a[1]);
    showStatus(a[0]);
    render();
  }).catch(function (e) {
    $("status").textContent = "Could not load data: " + e.message + " (retrying)";
    setTimeout(load, 60000);
  });
}
/* Poll a tiny endpoint; only download and redraw when the commit changed. */
function poll() {
  if (document.hidden) return;
  if (!DATA) { load(); return; }
  getJson("/api/version").then(function (v) {
    showStatus(v);
    if (DATA && v.commit && v.commit !== DATA.commit) {
      return getJson("/api/bundle").then(function (b) { applyBundle(b); showStatus(v); render(); });
    }
  }).catch(function () {});
}

/* ---------- Events (delegated; no per-row handlers) ---------- */
$("tabs").addEventListener("click", function (e) {
  var b = e.target.closest(".tab");
  if (!b) return;
  view = b.getAttribute("data-view");
  var tabs = document.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle("active", tabs[i] === b);
  limits = { picks: PAGE, crafts: PAGE, recipes: ROW_PAGE };
  tierLimit = {};
  render();
});
$("search").addEventListener("input", function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    limits = { picks: PAGE, crafts: PAGE, recipes: ROW_PAGE };
    tierLimit = {};
    if (view === "inventory") { if (DATA) fillPicks(); } else render();
  }, 300);
});
var content = $("content");
content.addEventListener("change", function (e) {
  var n = e.target.getAttribute && e.target.getAttribute("data-n");
  if (!n || e.target.type !== "checkbox") return;
  if (e.target.checked) owned[n] = 1; else delete owned[n];
  saveOwned();
  fillCrafts();
});
content.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");
  if (act === "add") {
    owned[t.getAttribute("data-n")] = 1;
    saveOwned(); syncChecks(); fillCrafts();
  } else if (act === "basics") {
    owned = Object.create(null);
    for (var i = 0; i < DATA.base.length; i++) owned[DATA.base[i]] = 1;
    saveOwned(); syncChecks(); fillCrafts();
  } else if (act === "clear") {
    owned = Object.create(null);
    saveOwned(); syncChecks(); fillCrafts();
  } else if (act === "more") {
    var k = t.getAttribute("data-k");
    limits[k] += k === "recipes" ? ROW_PAGE : PAGE;
    if (k === "picks") fillPicks(); else if (k === "crafts") fillCrafts(); else renderRecipes(query());
  } else if (act === "tiermore") {
    var tn = t.getAttribute("data-t");
    tierLimit[tn] = (tierLimit[tn] || TIER_PAGE) + TIER_PAGE;
    t.closest(".tier-body").innerHTML = tierBody(curTiers[tn]);
  }
});
/* <details> toggle does not bubble, so listen in the capture phase and fill closed tiers lazily. */
content.addEventListener("toggle", function (e) {
  var d = e.target;
  if (!d.open || !d.classList || !d.classList.contains("tier")) return;
  var body = d.lastElementChild, g = curTiers[d.getAttribute("data-t")];
  if (!body || !g || body.getAttribute("data-f") === "1") return;
  body.innerHTML = tierBody(g);
  body.setAttribute("data-f", "1");
}, true);

loadOwned();
load();
setInterval(poll, POLL_MS);
})();
</script></body></html>
